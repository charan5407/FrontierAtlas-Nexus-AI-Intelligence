[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frontieratlas-nexus"
version = "1.0.0"
description = "Autonomous AI & Venture Intelligence Graph Ingestion Pipeline for GraphOne / FrontierAtlas"
authors = [{ name = "AI Engineering Candidate", email = "candidate@frontieratlas.ai" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.0.0",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "rich>=13.7.0",
    "gspread>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
